<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fff7e5">
  <meta name="description" content="がおがおぷーんの料理ゲーム一覧です。">
  <title>ゲーム一覧｜がおがおぷーん</title>
  <link rel="icon" href="img/icons/favicon-apple.webp" type="image/webp">
  <style>
    :root {
      --ink: #40372f;
      --muted: #7d7269;
      --line: #e3d4be;
      --paper: #fffdf8;
      --accent: #d96f2f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: #fff7e5;
      font-family: "M PLUS 1p", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    }

    .page {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 22px 20px 40px;
    }

    .back {
      display: inline-block;
      padding: 8px 0;
      color: var(--ink);
      font-size: .82rem;
      font-weight: 800;
      text-decoration: none;
    }

    header { margin: 42px 0 30px; }

    header p {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 8vw, 2.4rem);
      line-height: 1.2;
    }

    .game-list {
      display: block;
      border-top: 1px solid var(--line);
    }

    .game-link {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 16px;
      align-items: center;
      padding: 19px 4px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      background: transparent;
      text-decoration: none;
    }

    .game-link strong { font-size: 1rem; }
    .game-link span { grid-column: 1; color: var(--muted); font-size: .72rem; font-weight: 700; }
    .game-link b { grid-column: 2; grid-row: 1 / 3; color: var(--accent); font-size: 1.4rem; }
    .game-link:active { background: rgba(255, 255, 255, .55); }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← 献立表に戻る</a>

    <header>
      <p>MINI GAMES</p>
      <h1>ゲーム一覧</h1>
    </header>

    <nav class="game-list" aria-label="ゲーム一覧">
      <a class="game-link" href="koiki-puzzle.html">
        <strong>お料理できるかな！！</strong>
        <span>食材をそろえるパズル</span>
        <b aria-hidden="true">›</b>
      </a>
      <a class="game-link" href="suika-game.html">
        <strong>ごちそうできるかな！！</strong>
        <span>食材をおとすパズル</span>
        <b aria-hidden="true">›</b>
      </a>
      <a class="game-link" href="dopagaki.html">
        <strong>食材とれるかな！！</strong>
        <span>食材をうちおとすシューティング</span>
        <b aria-hidden="true">›</b>
      </a>
    </nav>
  </main>
</body>
</html>
