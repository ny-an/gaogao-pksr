<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>食材チケットシミュレーション | ポケスリ献立表</title>
    <meta name="description" content="ポケモンスリープの食材チケットで、食材がどれぐらい出るか、目当ての食材まで何枚必要かをシミュレーションするツールです。">
    <link rel="icon" href="img/icons/favicon-apple.webp" type="image/webp">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="standalone-popup-page" data-standalone="food-ticket">
<main class="standalone-popup-shell">
    <header class="standalone-popup-header">
        <a class="standalone-popup-back" href="index.html">← 献立表へ戻る</a>
        <p class="standalone-popup-kicker">ポケスリ計算ツール</p>
    </header>

    <div id="foodTicketModal" class="modal food-ticket-modal" aria-hidden="false">
        <div class="modal-content food-ticket-content" role="dialog" aria-modal="true" aria-labelledby="foodTicketTitle">
            <a class="food-ticket-close" href="index.html" aria-label="献立表へ戻る">&times;</a>
            <h2 id="foodTicketTitle">食材チケットシミュレーション</h2>
            <p class="food-ticket-trigger-note">必要な食材とチケットの種類を選んで計算します</p>

            <div class="food-ticket-mode-options" role="radiogroup" aria-label="シミュレーション種類">
                <label class="food-ticket-mode-option">
                    <input type="radio" name="foodTicketMode" value="simulation" checked>
                    <span>
                        <strong>出る量</strong>
                        <small>何がどれぐらい？</small>
                    </span>
                </label>
                <label class="food-ticket-mode-option">
                    <input type="radio" name="foodTicketMode" value="target">
                    <span>
                        <strong>必要枚数</strong>
                        <small>目当ての食材に届くまで</small>
                    </span>
                </label>
            </div>

            <div class="food-ticket-type-options" role="radiogroup" aria-label="チケット種類">
                <label class="food-ticket-type-option">
                    <input type="radio" name="foodTicketType" value="S" checked>
                    <span>
                        <strong>食材チケットS</strong>
                        <small>2種 × 5個（計10個）</small>
                    </span>
                </label>
                <label class="food-ticket-type-option">
                    <input type="radio" name="foodTicketType" value="M">
                    <span>
                        <strong>食材チケットM</strong>
                        <small>3種 × 10個（計30個）</small>
                    </span>
                </label>
                <label class="food-ticket-type-option">
                    <input type="radio" name="foodTicketType" value="L">
                    <span>
                        <strong>食材チケットL</strong>
                        <small>4種 × 25個（計100個）</small>
                    </span>
                </label>
            </div>

            <section id="foodTicketSimulationMode" class="food-ticket-mode-panel">
                <form id="foodTicketSimulationForm">
                    <label class="food-ticket-count-field" for="foodTicketCount">
                        <span>回す枚数</span>
                        <input type="number" id="foodTicketCount" min="1" max="1000" step="1" value="10" inputmode="numeric">
                    </label>
                    <button type="submit" class="food-ticket-submit">シミュレーションする</button>
                    <div id="foodTicketSimulationCalculating" class="food-ticket-calculating" role="status" aria-live="polite" hidden>計算中...</div>
                </form>

                <div id="foodTicketSimulationResult" class="food-ticket-result" aria-live="polite"></div>
            </section>

            <section id="foodTicketTargetMode" class="food-ticket-mode-panel" hidden>
                <details class="food-ticket-target-panel" open>
                    <summary>
                        <span>目当ての食材と数を指定</span>
                        <strong>何枚で届く？</strong>
                    </summary>
                    <p class="food-ticket-section-note">指定した食材をすべて目標数以上にするまでを、10,000回シミュレーションします。</p>
                    <div id="foodTicketTargetOptions" class="food-ticket-target-options"></div>
                    <button type="button" id="foodTicketTargetSubmit" class="food-ticket-target-submit">必要枚数をシミュレーション</button>
                    <div id="foodTicketTargetCalculating" class="food-ticket-calculating" role="status" aria-live="polite" hidden>計算中...</div>
                    <div id="foodTicketTargetResult" class="food-ticket-target-result" aria-live="polite"></div>
                </details>
            </section>

            <details class="food-ticket-available-panel">
                <summary>
                    <span>抽選対象の食材</span>
                    <strong id="foodTicketAvailableCount">19種</strong>
                </summary>
                <p class="food-ticket-section-note">リサーチノートに登録済みの食材だけをチェックしてください。</p>
                <div id="foodTicketAvailableOptions" class="food-ticket-available-options"></div>
            </details>

            <p class="food-ticket-note">ゲーム内の抽選確率は公開されていないため、登録食材を均等に抽選する前提です。1枚の中では種類が重複しないものとして計算します。</p>
        </div>
    </div>
</main>

<script src="js/data/foods.js"></script>
<script src="js/standalone_popup.js"></script>
<script src="js/food_ticket.js"></script>
<script src="js/food_ticket_ui.js"></script>
</body>
</html>
